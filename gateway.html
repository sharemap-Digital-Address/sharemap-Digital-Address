<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMap - Delivery Form</title>

    <!-- MONETAG IN-PAGE PUSH AD SCRIPT (Naka-comment out muna)
    <script>(function(s){s.dataset.zone='11719353',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
    -->

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 15px 12px 30px 12px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 18px 16px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        .timer {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
            margin: 8px 0;
        }
        .form-group {
            text-align: left;
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 3px;
            color: #cbd5e1;
        }
        .form-group input {
            width: 100%;
            padding: 9px;
            border: 1px solid #475569;
            border-radius: 6px;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus {
            border-color: #38bdf8;
        }
        .btn {
            background-color: #94a3b8;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: not-allowed;
            width: 100%;
            transition: 0.3s;
            margin-top: 8px;
        }
        .btn.active {
            background-color: #0284c7;
            cursor: pointer;
        }
        .messenger-alert {
            display: none;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 10px 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
            font-size: 12px;
            line-height: 1.3;
        }
        .error-msg {
            color: #f87171;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 1. PINAKATAAS: TITLE & FILL-UP FORM -->
        <h3 style="margin: 0 0 4px 0;">📍 Delivery Details</h3>
        <p id="subText" style="font-size: 12px; color: #94a3b8; margin: 0 0 12px 0;">Paki-sagutan ang mga detalye sa ibaba para sa iyong order:</p>

        <div class="form-group">
            <label for="fullName">👤 Buong Pangalan (Full Name):</label>
            <input type="text" id="fullName" placeholder="hal. Juan Dela Cruz">
        </div>

        <div class="form-group">
            <label for="phone">📞 Contact Number:</label>
            <input type="tel" id="phone" placeholder="hal. 09123456789">
        </div>

        <div class="form-group">
            <label for="landmark">🏠 Landmark / Kulay ng Gate (Opsyonal):</label>
            <input type="text" id="landmark" placeholder="hal. Tabi ng Sari-sari Store, Brngy Pintong Gatang">
        </div>

        <div class="timer" id="countdown">5</div>
        <p id="errorMsg" class="error-msg">⚠️ Paki-fillup ang Pangalan at Contact Number bago magpatuloy.</p>

        <!-- 2. KASUNOD: ACTION BUTTON -->
        <button id="proceedBtn" class="btn" disabled>Loading...</button>

        <!-- 3. PINAKA-IBABA: MESSENGER WARNING BOX -->
        <div id="messengerNotice" class="messenger-alert">
            ⚠️ <b>Gamit mo ang Messenger Browser:</b><br>
            Paki-sagutan ang form at pindutin ang button sa itaas. I-tap ang <b>"CONTINUE"</b> para magbukas sa Chrome browser.
        </div>
    </div>

    <script>
        const mainAppUrl = "./index.html?pass=true";
        // const directLinkUrl = "https://omg10.com/4/11719626"; // Direct Ad Link (Disabled)

        function isMessengerBrowser() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            return (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Messenger") > -1);
        }

        const countdownEl = document.getElementById('countdown');
        const btn = document.getElementById('proceedBtn');
        const noticeEl = document.getElementById('messengerNotice');
        const subTextEl = document.getElementById('subText');
        const errorMsgEl = document.getElementById('errorMsg');

        // Automatic restoration ng input kapag lumipat na sa Chrome
        window.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const nameFromUrl = urlParams.get('fn');
            const phoneFromUrl = urlParams.get('ph');
            const landmarkFromUrl = urlParams.get('lm');

            if (nameFromUrl && phoneFromUrl) {
                document.getElementById('fullName').value = nameFromUrl;
                document.getElementById('phone').value = phoneFromUrl;
                if (landmarkFromUrl) document.getElementById('landmark').value = landmarkFromUrl;

                localStorage.setItem('sharemap_fullname', nameFromUrl);
                localStorage.setItem('sharemap_phone', phoneFromUrl);
                localStorage.setItem('sharemap_landmark', landmarkFromUrl || "Wala");
                sessionStorage.setItem('access_granted', 'true');
            }
        });

        function getFormValues() {
            const nameVal = document.getElementById('fullName').value.trim();
            const phoneVal = document.getElementById('phone').value.trim();
            const landmarkVal = document.getElementById('landmark').value.trim();

            if (!nameVal || !phoneVal) {
                errorMsgEl.style.display = "block";
                return null;
            }

            errorMsgEl.style.display = "none";
            return {
                name: nameVal,
                phone: phoneVal,
                landmark: landmarkVal || "Wala"
            };
        }

        if (isMessengerBrowser()) {
            countdownEl.style.display = "none";
            noticeEl.style.display = "block";

            btn.classList.add("active");
            btn.removeAttribute("disabled");
            btn.textContent = "🌐 Lipat at Buksan sa Chrome";

            btn.onclick = () => {
                const data = getFormValues();
                if (data) {
                    localStorage.setItem('sharemap_fullname', data.name);
                    localStorage.setItem('sharemap_phone', data.phone);
                    localStorage.setItem('sharemap_landmark', data.landmark);
                    sessionStorage.setItem('access_granted', 'true');

                    const originUrl = window.location.origin + window.location.pathname;
                    const queryStr = `?fn=${encodeURIComponent(data.name)}&ph=${encodeURIComponent(data.phone)}&lm=${encodeURIComponent(data.landmark)}`;
                    const fullTargetUrl = originUrl + queryStr;
                    
                    const cleanUrl = fullTargetUrl.replace(/^https?:\/\//, '');
                    window.location.href = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end;`;
                }
            };
        } else {
            let timeLeft = 5;

            const timer = setInterval(() => {
                timeLeft--;
                countdownEl.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    countdownEl.style.display = "none";
                    btn.classList.add("active");
                    btn.removeAttribute("disabled");
                    btn.textContent = "Open ShareMap App";

                    btn.onclick = () => {
                        const data = getFormValues();
                        if (data) {
                            localStorage.setItem('sharemap_fullname', data.name);
                            localStorage.setItem('sharemap_phone', data.phone);
                            localStorage.setItem('sharemap_landmark', data.landmark);
                            sessionStorage.setItem('access_granted', 'true');

                            // window.open(directLinkUrl, '_blank'); // Naka-comment out ang pagbubukas ng ad tab
                            window.location.href = mainAppUrl;
                        }
                    };
                }
            }, 1000);
        }
    </script>

</body>
</html>
